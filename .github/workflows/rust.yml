name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    working-directory: libloadviz

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    # From: https://github.com/actions/cache/blob/main/examples.md#rust---cargo
    - uses: actions/cache@v3
      with:
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          libloadviz/target/
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

    # The screenshot/stillimage helper bins are gated behind the `webp`
    # feature, which links the system libwebp. Install it so CI can
    # compile-check those bins too.
    - run: sudo apt-get update && sudo apt-get install -y libwebp-dev

    # --all-targets --all-features compile-checks everything: lib, both
    # helper bins, tests, and benches.
    - run: cargo build --all-targets --all-features --verbose
    - run: cargo test --all-features --verbose
