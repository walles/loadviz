[package]
name = "libloadviz"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
libc = "0.2.146"
opaque-pointer = "0.8.8"
bracket-noise = "~0.8"

[dependencies.libwebp-sys2]
version = "0.1.7"
features = ["1_2", "mux"]
optional = true

[features]
# libwebp-sys2 links the system libwebp, and only the screenshot and stillimage
# helper bins need it. Keeping it behind an off-by-default feature lets
# `cargo test` and `cargo bench` build without libwebp installed.
webp = ["dep:libwebp-sys2"]

[lib]
# Ref: https://crates.io/crates/cargo-xcode
crate-type = ["lib", "staticlib"]

[build-dependencies]
cbindgen = "0.24.3"

[dev-dependencies]
criterion = "0.5"

# See: https://doc.rust-lang.org/cargo/reference/profiles.html
[profile.bench]
# "true" = everything, so we can see source code in Instruments when profiling
debug = true

# Ref:
# https://github.com/walles/riff/blob/432c0b08523818e461eded0407a009db2e795996/Cargo.toml#L48-L54
lto = "thin"

[[bench]]
name = "rendering"
harness = false

# The webp helper bins link the system libwebp; gate them so ordinary builds,
# tests, and benchmarks don't need it.
[[bin]]
name = "screenshot"
path = "src/bin/screenshot.rs"
required-features = ["webp"]

[[bin]]
name = "stillimage"
path = "src/bin/stillimage.rs"
required-features = ["webp"]
